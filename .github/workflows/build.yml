name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.platform.os }}

    defaults:
      run:
        shell: ${{ matrix.platform.shell }}

    strategy:
      fail-fast: false
      matrix:
        platform:
        - { name: macos-clang,     os: macos-latest,   shell: sh }
        - { name: ubuntu_gcc14,    os: ubuntu-26.04,   shell: sh, gcc: 14 }
        - { name: ubuntu_gcc15,    os: ubuntu-26.04,   shell: sh, gcc: 15 }
        - { name: windows-mingw32-deprecated, os: windows-latest, shell: 'msys2 {0}', msystem: mingw32, msys-env: mingw-w64-i686 }
        - { name: windows-ucrt64,  os: windows-latest, shell: 'msys2 {0}', msystem: ucrt64, msys-env: mingw-w64-ucrt-x86_64 }

        build-type: [Release]
        build-static:
        - { name: static, value: ON }
        - { name: dynamic, value: OFF }
        exclude:
          # macOS does not support fully static executables
        - platform: { name: macos-clang, os: macos-latest, shell: sh }
          build-static: { name: static, value: ON }
    steps:
    - uses: actions/checkout@v7

    - name: Setup GNU/Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install \
            libjitterentropy3-dev libssl-dev ninja-build zlib1g-dev

    - name: Select GCC version
      if: runner.os == 'Linux'
      run: |
        sudo add-apt-repository ppa:ubuntu-toolchain-r/ppa -y
        sudo apt-get update
        sudo apt-get install -y gcc-${{matrix.platform.gcc}} g++-${{matrix.platform.gcc}}
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{matrix.platform.gcc}} 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-${{matrix.platform.gcc}} 100

    - name: Setup macOS dependencies
      if: runner.os == 'macOS'
      run: |
        brew install zlib
        echo "CMAKE_PREFIX_PATH=$(brew --prefix openssl):$(brew --prefix zlib)" >> $GITHUB_ENV


    - name: Setup Windows dependencies
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ matrix.platform.msystem }}
        suppress-deprecation-warnings: ${{ matrix.platform.msystem == 'mingw32' && 'msystem-mingw32' || '' }}
        install: >-
          ${{matrix.platform.msys-env}}-gcc
          ${{matrix.platform.msys-env}}-cmake
          ${{matrix.platform.msys-env}}-ninja
          ${{matrix.platform.msys-env}}-openssl
          ${{matrix.platform.msys-env}}-zlib

    - name: Configure CMake
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DBUILD_STATIC=${{ matrix.build-static.value }} -DBUILD_TESTING=ON -DCMAKE_C_FLAGS="-Wall -Werror -Wpedantic"

    - name: Build
      run: cmake --build build

    - name: Test
      run: ctest --test-dir build --output-on-failure

    - name: Install
      run: cmake --install build --strip --prefix install

    - name: Upload
      uses: actions/upload-artifact@v7
      with:
        name: unshield_${{ github.sha }}_${{ matrix.platform.name }}_${{ matrix.build-static.name }}
        path: install
        if-no-files-found: error
